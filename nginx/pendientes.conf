server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript;

    location = / {
        return 302 /pendientes/;
    }

    location /pendientes/ {
        try_files $uri $uri/ /pendientes/index.html;
    }
}
