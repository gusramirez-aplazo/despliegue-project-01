services:
  build:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    command: sh -c "npm ci && npm run build && npm run package"

  web:
    image: nginx:1.29-alpine
    container_name: pendientes-web
    ports:
      - "80:80"
    volumes:
      - ./dist:/usr/share/nginx/html/pendientes:ro
      - ./nginx/pendientes.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      build:
        condition: service_completed_successfully
